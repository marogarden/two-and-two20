<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ふたりのプロポーズ</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="titleScreen" class="screen active"><div class="panel"><div class="logo">💍</div><div class="title">ふたりのプロポーズ</div><div class="sub">ランダムな言葉だけで、最高のプロポーズを。</div><button class="btn primary" onclick="goName()">はじめる</button></div></div>
<div id="nameScreen" class="screen"><div class="panel"><div class="title">あなたの名前</div><div class="sub">ゲーム中に表示する名前です</div><input id="nameInput" class="input" maxlength="12" placeholder="名前を入力"><button class="btn primary" onclick="saveName()">次へ</button></div></div>
<div id="roomScreen" class="screen"><div class="panel"><div class="title">ルーム</div>
<div id="roomSettings" class="setting open"><h3>🎴 追加する言葉</h3><div class="small">ルームを作る前だけ設定できます。追加した言葉はこのゲームのカード候補になります。</div><input id="roomCustomInput" class="input" placeholder="好きな言葉を入力"><button class="btn" onclick="addRoomWord()">＋ 追加</button><div id="roomWordList" class="wordlist"></div></div>
<button class="btn primary" onclick="createRoom()">＋ ルームを作成</button><div class="sub">または</div><input id="roomInput" class="input" maxlength="8" placeholder="ルームコード"><button class="btn" onclick="joinRoom()">参加する</button><div id="roomInfo"></div></div></div>
<div id="gameScreen" class="screen"><div class="panel"><div id="gameTitle" class="title">🎴 プロポーズを作ろう</div><div id="gameSub" class="sub">好きなカードだけ選んで、好きな順番に。</div><div id="scoreText" class="score">あなた: 0 / 5　　相手: 0 / 5</div><div id="timerBox" class="timerBox" style="display:none"><span>⏱</span><strong id="timerText">01:00</strong></div><div id="waitingBox" class="waitingBox"><div class="waitingIcon">💌</div><div id="waitingMessage">相手がプロポーズのセリフを決めています</div></div><div id="cards" class="cards"></div><div id="compose" class="compose">ここに選んだ言葉が入ります</div><div class="small">助詞は必要なときだけ追加できます</div><div id="particles" class="particles"></div><button id="sendBtn" class="btn primary send" onclick="sendProposal()">💌 送る</button></div></div></div>
<div id="revealScreen" class="screen"><div class="stars"></div><div class="panel"><div class="mail">💌</div><div id="revealText" class="sub">あなたに言葉が届きました</div><div class="letter"><div id="receivedProposal" class="proposal"></div></div><button class="btn primary" onclick="showChoices()">開く</button></div></div>
<div id="choiceScreen" class="screen"><div class="panel"><div class="title">あなたの返事は？</div><div id="choiceProposal" class="sub"></div><button class="btn primary choice" onclick="answer('marriage')">💍 結婚する</button><button class="btn danger choice" onclick="answer('breakup')">💔 別れよう</button></div></div>
<div id="resultScreen" class="screen"><div id="resultStars" class="stars"></div><div class="panel"><div id="resultIcon" class="resultIcon"></div><div id="resultTitle" class="resultTitle"></div><div id="resultText" class="sub"></div><div id="resultScore" class="score"></div><button id="nextBtn" class="btn">次のプロポーズ</button></div></div>
<div id="winnerScreen" class="screen"><div class="panel"><div class="resultIcon">🏆</div><div class="resultTitle">ゲーム終了</div><div id="winnerText" class="sub"></div><div id="winnerScore" class="score"></div></div></div>
<script src="app_v19.js?v=19"></script>
</body></html>
